  <path d="M24 22 C20 18 15 18 11 21 C15 24 20 24 24 22 Z" fill="#3b8d57" opacity=".85"/>
  <path d="M40 24 C43 20 48 19 53 22 C49 26 44 26 40 24 Z" fill="#3b8d57" opacity=".85"/>
