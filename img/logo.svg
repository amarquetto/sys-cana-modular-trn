  <path d="M12 55 H52" stroke="#dcb94a" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
</g>
  <text x="78" y="36" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#11301f">SysCana</text>
  <text x="79" y="54" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#b48a12">ERP DA CANA-DE-AÇÚCAR</text>
