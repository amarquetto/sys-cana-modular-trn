    <path d="M17.6 44 L22.6 44.3"/><path d="M18.4 35 L23.4 35.3"/><path d="M19.4 27 L24.2 27.2"/>
    <path d="M28.6 46 L34 46"/><path d="M28.8 37 L34.2 37"/><path d="M29 28 L34.4 28"/>
