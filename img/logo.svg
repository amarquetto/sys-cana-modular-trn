<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="SysCana — ERP da cana-de-açúcar">
  <g>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5733"/>
      <stop offset="1" stop-color="#0c2417"/>
    </linearGradient>
    <linearGradient id="lgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e3a6"/>
      <stop offset="0.5" stop-color="#dcb94a"/>
